# Quantum Gym — docker compose para el VPS.
#
# Uso en el VPS (tras copiar la imagen o el contexto):
#   docker compose -f deploy/docker-compose.yml up -d
#
# El contenedor escucha en el puerto 8080 del host; pon delante un proxy
# con TLS (Caddy incluido abajo, o certbot+nginx si ya tienes uno).

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: quantum-gym-web
    restart: unless-stopped
    ports:
      - "8080:80"

  # Proxy con HTTPS automático (Let's Encrypt). Antes de usarlo:
  # 1. Apunta tu dominio (registro A) a la IP del VPS
  # 2. Reemplaza TU-DOMINIO.com en deploy/Caddyfile
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
