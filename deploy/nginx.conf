# Quantum Gym — configuración nginx para servir el build web de Flutter.
# Se usa dentro del contenedor Docker (ver Dockerfile); si prefieres nginx
# nativo en el VPS, copia el bloque `server` a /etc/nginx/sites-available/.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión para JS/JSON (el bundle de Flutter y el dataset de ejercicios)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: cualquier ruta desconocida vuelve a index.html (GoRouter maneja el resto)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre: caché larga
    location ~* \.(js|css|wasm|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Imágenes del dataset de ejercicios (1,324 thumbnails): caché larga
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html y el service worker nunca se cachean (para que los deploys
    # nuevos lleguen al instante)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }
}
