name: gym_app
description: "QUANTUM GYM - Plataforma de Gestión de Gimnasios"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  google_nav_bar: ^5.0.7

  # Firebase - Actualizadas a versiones más recientes
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.3.0

  # State Management
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4

  # Dependency Injection
  get_it: ^8.3.0
  injectable: ^2.4.1
  dartz: ^0.10.1

  # Navigation
  go_router: ^14.2.0

  # AI & APIs
  google_generative_ai: ^0.4.7
  http: ^1.6.0

  # Utils
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  equatable: ^2.0.8
  logger: ^2.4.0

  # Offline-first
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.3

  # Charts & Data
  fl_chart: ^0.68.0
  flutter_hooks: ^0.20.5

  # Owner Admin System (GYM-APP screens)
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  drag_and_drop_lists: ^0.4.2
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  firebase_messaging: ^15.1.0
  firebase_app_check: ^0.3.0
  flutter_local_notifications: ^18.0.1
  file_picker: ^10.3.10
  desktop_drop: ^0.7.0
  path_provider: ^2.1.4

  # Supabase pilot (measurement module) — see docs plan for scope.
  # Plain `supabase` client on purpose: this pilot never uses Supabase's own
  # Auth (GoTrue) or Flutter-widget integrations, only PostgREST via the JWT
  # bridge, so there's no need for supabase_flutter's Flutter dependency.
  # No JWT-signing package here on purpose: the bridge no longer signs
  # tokens client-side (see supabase_jwt_bridge.dart) — it exchanges the
  # real Firebase ID token for a Supabase JWT via a server-side function.
  supabase: ^2.8.0
  flutter_dotenv: ^5.2.1


  uuid: any
  path: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints actualizados a versión más reciente
  flutter_lints: ^5.0.0
  network_image_mock: ^2.1.1
  fake_cloud_firestore: ^3.1.0
  mocktail: ^1.0.5
  bloc_test: ^9.1.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/bodybuilding.png
    - assets/data/exercises_dataset.json
    - assets/exercise_images/
    - .env.supabase
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
